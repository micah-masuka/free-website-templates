<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RSVP for Elliot Whitmore and Mara Okonkwo — reply by 1 May 2026.">
  <title>RSVP — Elliot &amp; Mara</title>
  <link rel="stylesheet" href="reply.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <div class="envelope">
    <p class="envelope-to">The favour of a reply is requested</p>

    <main class="reply-slip">
      <div class="slip-stamp" aria-hidden="true">RSVP</div>

      <header class="slip-head">
        <h1>Elliot Whitmore <span>&amp;</span> Mara Okonkwo</h1>
        <p class="slip-deadline">Reply by <time datetime="2026-05-01">1 May 2026</time></p>
      </header>

      <form class="reply-form" id="rsvp-form" action="mailto:rsvp@example.com" method="post" enctype="text/plain">
        <fieldset class="field-group">
          <legend>Will you attend?</legend>
          <label class="choice">
            <input type="radio" name="attendance" value="yes" required>
            <span>Joyfully accepts</span>
          </label>
          <label class="choice">
            <input type="radio" name="attendance" value="no">
            <span>Regretfully declines</span>
          </label>
        </fieldset>

        <label class="field field--ruled">
          <span class="field-label">Guest name(s)</span>
          <input type="text" name="names" required autocomplete="name">
        </label>

        <label class="field field--ruled">
          <span class="field-label">Number attending</span>
          <select name="count" required>
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>

        <fieldset class="field-group">
          <legend>Meal choice (reception)</legend>
          <label class="choice">
            <input type="radio" name="meal" value="beef" required>
            <span>Beef — slow-roasted rib</span>
          </label>
          <label class="choice">
            <input type="radio" name="meal" value="fish">
            <span>Bream — grilled with lemon butter</span>
          </label>
          <label class="choice">
            <input type="radio" name="meal" value="vegetarian">
            <span>Vegetarian — mushroom and spinach pie</span>
          </label>
        </fieldset>

        <label class="field field--ruled">
          <span class="field-label">Dietary requirements</span>
          <textarea name="dietary" rows="2"></textarea>
        </label>

        <label class="field field--ruled">
          <span class="field-label">Song request (optional)</span>
          <input type="text" name="song">
        </label>

        <div class="form-actions">
          <button type="submit">Send reply</button>
        </div>
      </form>

      <p class="slip-fallback">Or email <a href="mailto:rsvp@example.com">rsvp@example.com</a> · <a href="../registry-template/details.html">Details</a> · <a href="../weekend-itinerary/index.html">Schedule</a></p>
      <p class="slip-copy">&copy; 2026 Elliot Whitmore &amp; Mara Okonkwo · Harare, Zimbabwe</p>
    </main>

    <div class="perforation" aria-hidden="true"></div>
  </div>

  <script src="js/reply.js"></script>
</body>
</html>
